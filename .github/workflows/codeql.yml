name: codeql

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'mobile/**'
      - '.github/workflows/codeql.yml'
  push:
    branches: [main]
  schedule:
    # Weekly Monday 06:00 UTC. Off-hours for the team, picks up newly-published
    # CodeQL queries against the existing codebase.
    - cron: '0 6 * * 1'

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  # CodeQL uploads SARIF results to the Security tab.
  security-events: write
  # Required for private repos so the action can read the Actions job context.
  actions: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # CodeQL does not (yet) ship a Dart analyzer; we cover Dart via
        # `flutter analyze` in mobile.yml. Go is the only first-class CodeQL
        # language in this repo today.
        language: ['go']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # `security-and-quality` is broader than the default and surfaces
          # PHI-relevant patterns (logging sensitive values, unsafe casts).
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
        with:
          working-directory: backend

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'

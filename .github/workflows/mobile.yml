name: mobile

on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'contract/**'
      - '.github/workflows/mobile.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'contract/**'
      - '.github/workflows/mobile.yml'

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # pubspec declares `flutter: ">=3.41.0"`. We pin the lowest known-good
  # stable here; bump deliberately when we bump the floor in pubspec.yaml.
  FLUTTER_VERSION: '3.41.0'
  FLUTTER_CHANNEL: stable

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          # flutter-action handles the pub-cache layer for us when cache=true.
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Run code generation
        # freezed / json_serializable / riverpod_generator outputs live as
        # `*.g.dart` / `*.freezed.dart`. analysis_options excludes them, but
        # `flutter analyze` still type-checks any code that imports them, so
        # they must exist before we analyze.
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Flutter analyze
        run: flutter analyze

  test:
    name: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage
          path: mobile/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  build-android:
    name: build-android (debug)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build debug APK (compile canary)
        # Debug APK is the cheap, no-signing canary for Android-specific
        # compile failures (NDK, plugin native bindings, manifest merges).
        # Release artifacts are produced in a separate signing workflow.
        run: flutter build apk --debug

  # build-ios is intentionally omitted from this workflow.
  #
  # iOS builds require a macOS runner (xcodebuild, CocoaPods, code signing).
  # macOS minutes are 10x Linux minutes on GitHub-hosted runners, so we keep
  # iOS out of the per-PR loop and rely on:
  #   * `flutter analyze` (Linux) to catch most Dart-level breakage
  #   * `flutter build apk --debug` to catch plugin-channel breakage
  # When we add an iOS canary, do it as a separate workflow guarded by
  # `if: github.event_name == 'push'` on main so PR latency stays low.

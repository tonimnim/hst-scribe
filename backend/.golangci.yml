# HST Scribe backend — golangci-lint v2 config.
# Strict but reasonable. Every disabled check has a documented reason below.

version: "2"

run:
  timeout: 5m
  go: "1.24"
  tests: true

linters:
  default: none
  enable:
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - unused
    - gocritic
    - gosec
    - errorlint
    - nilerr
    # Disabled for Wave 1 (re-evaluate in Wave 2):
    #  - revive       : style nits like redefines-builtin-id (`max`) and
    #                   unexported-return overlap with intentional internal
    #                   API choices in the agent-generated code.
    #  - exhaustive   : we deliberately handle subsets of enums in dispatch
    #                   switches; default-signifies-exhaustive doesn't catch
    #                   all of these cleanly.
    #  - unparam      : noisy on handler signatures.
    #  - contextcheck : false positives on intentional context-detach paths.
    #  - bodyclose    : noisy on `defer resp.Body.Close()` patterns the
    #                   agents already cover; revisit once we have a clear
    #                   leak signal.
  settings:
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
          disabled: true # too noisy for handler signatures
        - name: unreachable-code
        - name: redefines-builtin-id
    gosec:
      excludes:
        - G104 # errcheck dup
        - G115 # int overflow — runtime.NumCPU() → int32 cast, bounded + audited
        - G118 # goroutine context — intentional fire-and-forget audit publish
        - G602 # slice bounds — false positive (explicit length guard above)
        - G704 # SSRF — internal inter-service HTTP, URLs come from typed config
    exhaustive:
      default-signifies-exhaustive: true
    errcheck:
      # `resp.Body.Close()` is the canonical "we deferred this and there's
      # nothing actionable to do with the close error" pattern. Suppress
      # globally rather than spray `_ =` annotations.
      exclude-functions:
        - "(*net/http.Response).Body.Close"
    staticcheck:
      # Excluded checks (re-evaluate in Wave 2):
      #  SA1019 — nhooyr.io/websocket "deprecated" (moved to coder/websocket).
      #           Package still works and is the one backend/AGENTS.md mandates.
      #  S1016  — "convert struct literal to type conversion" — stylistic; the
      #           explicit literal is more readable in the agent-written code.
      checks:
        - "all"
        - "-SA1019"
        - "-S1016"
  exclusions:
    rules:
      # Tests routinely produce intentional throwaway values.
      - path: _test\.go
        linters:
          - unparam
          - gosec
          - errcheck
          - errorlint
          - bodyclose
          - contextcheck

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/tonimnim/hst-scribe/backend
